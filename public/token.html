<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tampilkan Token</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500">
  <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-8 w-full max-w-md text-center animate-fadeIn">
    <h1 class="text-3xl font-extrabold text-indigo-700 mb-4 drop-shadow">Token Ujian</h1>
    
    <div id="token" 
         class="text-xl font-mono text-gray-900 bg-gradient-to-r from-gray-100 to-gray-200 rounded-xl p-4 border border-gray-300 shadow-inner">
      Loading...
    </div>

    <button id="reloadBtn" 
            class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
      Reload
    </button>
  </div>
<script>
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVzbWt2ZWdndXR4emtsYXZzcG5uIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAzODIyNTQsImV4cCI6MjA3NTk1ODI1NH0.18vlPWg1S_6ocoCWKaCh_KU41TbipXyQNS2r5GKRQ44";

async function fetchToken() {
  const tokenDiv = document.getElementById("token");
  tokenDiv.innerText = "Loading...";

  const params = new URLSearchParams(window.location.search);
  const hash = params.get("h");

  if (!hash) {
    tokenDiv.innerText = "Link tidak valid";
    return;
  }

  const res = await fetch(
    "https://esmkveggutxzklavspnn.supabase.co/functions/v1/get-school-token?h=" +
      hash +
      "&_=" +
      Date.now(),
    {
      headers: { apikey: SUPABASE_ANON_KEY },
      cache: "no-store",
    }
  );

  const data = await res.json();
  tokenDiv.innerText = data.token || data.error || "Token belum tersedia";
}

document.getElementById("reloadBtn").addEventListener("click", fetchToken);
fetchToken();
</script>


  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.8s ease-out;
    }
  </style>
</body>
</html>
