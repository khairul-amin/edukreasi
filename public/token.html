<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Ujian</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600">
  <div class="bg-white/90 backdrop-blur-md rounded-2xl shadow-xl p-8 w-full max-w-md text-center animate-fadeIn">
    <h1 class="text-3xl font-extrabold text-indigo-700 mb-4">Token Ujian</h1>

    <div id="token" class="text-xl text-gray-800 font-mono p-4 rounded-lg bg-gray-100 border border-gray-300">
      Memuat data...
    </div>

    <p id="errorMsg" class="hidden mt-6 text-red-600 font-medium leading-relaxed">
      Ups! Tautan ini tidak bisa digunakan. Pastikan kamu membuka link token dari dashboard sekolah.
    </p>
  </div>

  <script>
    async function fetchToken() {
      const tokenDiv = document.getElementById("token");
      const errorMsg = document.getElementById("errorMsg");

      try {
        const params = new URLSearchParams(window.location.search);
        const hash = params.get("h");

        // 🔹 Jika hash tidak ditemukan di URL
        if (!hash) {
          tokenDiv.classList.add("hidden");
          errorMsg.classList.remove("hidden");
          return;
        }

        const res = await fetch(`/api/token?h=${hash}&_=${Date.now()}`, { cache: "no-store" });
        const data = await res.json();

        if (data.token && data.token !== "Tidak ada token") {
          tokenDiv.innerText = data.token;
          tokenDiv.classList.add("text-5xl", "font-bold", "text-indigo-700");
        } else {
          tokenDiv.innerText = "⚠️ Token belum tersedia";
        }
      } catch (err) {
        console.error(err);
        tokenDiv.classList.add("hidden");
        errorMsg.classList.remove("hidden");
      }
    }

    fetchToken();
  </script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.6s ease-out;
    }
  </style>
</body>
</html>
