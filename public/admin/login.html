<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk Admin Lisensi | Edukreasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/android-chrome-192x192.png">
  <script type="module" src="../js/login.js" defer></script>
</head>
<body class="min-h-screen bg-stone-950 text-stone-100">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(251,191,36,0.14),_transparent_26%),radial-gradient(circle_at_bottom_right,_rgba(14,165,233,0.16),_transparent_28%),linear-gradient(180deg,_#0c0a09,_#111827)]"></div>
  <main class="relative mx-auto flex min-h-screen max-w-5xl items-center justify-center px-6 py-16">
    <section class="w-full max-w-md">
      <div class="rounded-[2rem] border border-white/10 bg-[#0f1117]/90 p-8 shadow-2xl shadow-stone-950/50 backdrop-blur-xl">
        <div class="mb-8">
          <p class="text-sm uppercase tracking-[0.35em] text-stone-400">Login Dashboard</p>
          <h2 class="mt-3 text-3xl font-bold text-white md:text-4xl">Masuk Dengan Google</h2>
        </div>
        <button id="loginBtn" type="button" class="flex w-full items-center justify-center gap-3 rounded-2xl border border-white/10 bg-white px-5 py-4 text-base font-semibold text-stone-900 transition hover:-translate-y-0.5 hover:bg-stone-100">
          <span class="grid h-9 w-9 place-items-center rounded-full bg-stone-900 text-sm font-black text-white">G</span>
          Masuk Dengan Google
        </button>

        <div class="mt-6 rounded-2xl border border-sky-400/20 bg-sky-500/10 px-4 py-3 text-sm leading-7 text-sky-100">
          Pastikan akun Google Anda sudah ada di Supabase tabel <code>users</code> dengan role <code>superadmin</code>.
        </div>
        <p id="statusText" class="mt-4 text-sm text-stone-400">Siap terhubung ke Google login.</p>
      </div>
    </section>
  </main>
</body>
</html>
