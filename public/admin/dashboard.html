<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Media Brilliant</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-blue-700 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Dashboard Admin</h1>
    <div class="flex items-center space-x-4">
      <span id="userEmail" class="font-medium"></span>
      <button id="logoutBtn" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
    </div>
  </header>

  <!-- Main content -->
  <main class="flex-1 p-4 space-y-6">

    <!-- Metrics Cards (Superadmin Only) -->
    <div id="metricCards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>

    <!-- Admin Table (Superadmin Only) -->
    <section id="adminTable" class="hidden">
      <h2 class="text-lg font-semibold mb-2">Daftar Pengguna</h2>
      <div class="overflow-x-auto bg-white rounded shadow">
        <table class="min-w-full border-collapse border border-gray-300">
          <thead id="tableHead" class="bg-gray-200 text-gray-700"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <!-- User Form (User Only) -->
    <section id="userForm" class="hidden max-w-md bg-white p-6 rounded shadow">
      <h2 class="text-lg font-semibold mb-4">Data Sekolah</h2>

      <div class="space-y-3">
        <input id="nama" type="text" placeholder="Nama Sekolah" class="w-full border rounded p-2">
        <input id="npsn" type="text" placeholder="NPSN" class="w-full border rounded p-2">
        <input id="link" type="text" placeholder="Link Spreadsheet" class="w-full border rounded p-2">
        <input id="hp" type="text" placeholder="No. HP" class="w-full border rounded p-2">
      </div>

      <div class="mt-4 flex gap-2">
        <button id="saveBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Simpan</button>
      </div>

      <!-- QR Section -->
      <div class="mt-6 border-t pt-4">
        <h3 class="text-md font-semibold mb-2">QR Code</h3>

        <!-- Wrapper agar bisa di-hide -->
        <div id="qrWrapper" class="text-center space-y-2">
          <div id="qrCode" class="flex justify-center"></div>
          <a id="downloadQR" href="#" download="qrcode.png"
             class="hidden bg-gray-600 text-white px-3 py-1 rounded hover:bg-gray-700 inline-block">Download QR</a>
        </div>

        <div class="mt-4 flex justify-center">
          <button id="generateQRBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
            Generate QR
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="bg-gray-200 text-center text-gray-600 py-3 text-sm">
    &copy; 2025 Media Brilliant. All rights reserved.
  </footer>

  <!-- JS -->
  <script type="module" src="../js/dashboard.js"></script>
</body>
</html>
