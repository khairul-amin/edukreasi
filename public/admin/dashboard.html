<!DOCTYPE html>
<html lang="id"
  x-data="{
    darkMode: JSON.parse(localStorage.getItem('darkMode')) || false,
    sidebarOpen: true
  }"
  x-init="$watch('darkMode', v => localStorage.setItem('darkMode', JSON.stringify(v)))"
  :class="{ 'dark bg-gray-900 text-white': darkMode }">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard PSI Fathir Alfath</title>

  <!-- Alpine.js & Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>

  <!-- Script tambahan -->
  <script type="module" src="../js/dashboard.js" defer></script>
  <script type="module" src="../js/qr.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    html, body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>

<body class="flex h-screen overflow-hidden font-sans bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">

  <!-- ===== Sidebar ===== -->
  <aside
    class="bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 w-64 flex-shrink-0 flex flex-col fixed h-screen transition-transform duration-300"
    :class="{'-translate-x-full md:translate-x-0': !sidebarOpen}">
    <div class="p-4 text-lg font-bold border-b dark:border-gray-700">📊 Dashboard</div>

    <nav class="p-4 flex-1 space-y-2">
      <a href="#" class="block px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700">🏠 Dashboard</a>
      <a href="#" class="block px-3 py-2 rounded hover:bg-gray-200 dark:hover:bg-gray-700">👤 Users</a>
    </nav>

    <div class="p-4 border-t dark:border-gray-700 text-sm text-center">
      <p class="text-gray-500 dark:text-gray-400">&copy; 2025 PSI</p>
    </div>
  </aside>

  <!-- ===== Main Area ===== -->
  <div class="flex-1 flex flex-col overflow-y-auto ml-64 transition-all duration-300">

    <!-- ===== Header ===== -->
    <header class="flex justify-between items-center bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-6 py-4 shadow-sm">
      <div class="flex items-center gap-3">
        <button @click="sidebarOpen = !sidebarOpen" class="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 md:hidden">
          ☰
        </button>
        <h1 class="text-xl font-bold">Dashboard</h1>
      </div>

      <div class="flex items-center gap-4">
        <button @click="darkMode = !darkMode"
                class="p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          <span x-show="!darkMode">🌞</span>
          <span x-show="darkMode">🌙</span>
        </button>
        <p id="userEmail" class="text-gray-600 dark:text-gray-300"></p>
        <button id="logoutBtn"
                class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition">
          Logout
        </button>
      </div>
    </header>

    <!-- ===== Main Content ===== -->
    <main class="p-6 space-y-6 bg-gray-50 dark:bg-gray-900 flex-1">

      <!-- === Metric Cards === -->
      <section id="metricCards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Contoh dummy metric -->
        <div class="bg-white dark:bg-gray-800 p-4 rounded shadow transition">
          <p class="text-gray-600 dark:text-gray-400 text-sm">Total Sekolah</p>
          <h2 class="text-2xl font-bold mt-2">120</h2>
        </div>
        <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
          <p class="text-gray-600 dark:text-gray-400 text-sm">User Aktif</p>
          <h2 class="text-2xl font-bold mt-2">87</h2>
        </div>
        <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
          <p class="text-gray-600 dark:text-gray-400 text-sm">QR Terbuat</p>
          <h2 class="text-2xl font-bold mt-2">54</h2>
        </div>
        <div class="bg-white dark:bg-gray-800 p-4 rounded shadow">
          <p class="text-gray-600 dark:text-gray-400 text-sm">Token Aktif</p>
          <h2 class="text-2xl font-bold mt-2">39</h2>
        </div>
      </section>

      <!-- === User Form === -->
      <section id="userForm" class="max-w-md bg-white dark:bg-gray-800 p-6 rounded shadow space-y-4">
        <h2 class="text-lg font-semibold border-b border-gray-200 dark:border-gray-700 pb-2">Data Sekolah</h2>

        <div class="space-y-3">
          <input id="nama" type="text" placeholder="Nama Sekolah"
                 class="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
          <input id="npsn" type="text" placeholder="NPSN"
                 class="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
          <input id="link" type="text" placeholder="Link Spreadsheet"
                 class="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
          <input id="hp" type="text" placeholder="No. HP"
                 class="w-full border border-gray-300 dark:border-gray-600 rounded p-2 bg-white dark:bg-gray-700">
        </div>

        <div class="flex gap-2 mt-4">
          <button id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Simpan</button>
        </div>

        <!-- === QR Section === -->
        <div class="mt-6 border-t border-gray-200 dark:border-gray-700 pt-4">
          <div id="qrWrapper" class="text-center space-y-2">
            <div id="qrCode" class="flex justify-center"></div>
            <a id="downloadQR" href="#" download="qrcode.png"
               class="hidden bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded inline-block transition">Download QR</a>
          </div>

          <div class="mt-4 flex justify-center gap-2">
            <button id="generateQRBtn"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition">
              Generate QR
            </button>
            <button id="generateLinkBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded transition">
              Generate Link Token
            </button>
          </div>

          <div id="linkTokenWrapper" class="mt-4 hidden text-center">
            <p class="text-gray-600 dark:text-gray-400 mb-2">Link Token Sekolah:</p>
            <a id="linkToken" href="#" target="_blank"
               class="text-blue-600 dark:text-blue-400 underline break-all"></a>
            <div class="mt-2">
              <button id="copyLinkBtn"
                      class="bg-gray-600 hover:bg-gray-700 text-white px-3 py-1 rounded">Salin</button>
            </div>
          </div>
        </div>
      </section>

      <!-- === Admin Table === -->
      <section id="adminTable" class="bg-white dark:bg-gray-800 rounded shadow p-4 overflow-auto">
        <h2 class="text-lg font-semibold mb-4 border-b border-gray-200 dark:border-gray-700 pb-2">Data Semua User</h2>
        <table class="min-w-full border border-gray-300 dark:border-gray-600 table-auto">
          <thead id="tableHead" class="bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </section>
    </main>
  </div>
</body>
</html>
