<!DOCTYPE html>
<html lang="id" x-data="{ darkMode: false }"
      x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
      :class="{'dark bg-gray-900': darkMode}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard PSI Fathir Alfath</title>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="../js/dashboard.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="font-sans bg-gray-100 text-gray-800">

  <!-- Sidebar -->
  <aside class="w-64 bg-white shadow-md h-screen fixed">
    <div class="p-4 font-bold text-lg">Dashboard</div>
    <nav class="mt-6">
      <a href="#" class="block px-4 py-2 hover:bg-gray-200 rounded">Dashboard</a>
      <a href="#" class="block px-4 py-2 hover:bg-gray-200 rounded">Users</a>
    </nav>
  </aside>

  <!-- Main Content -->
  <div class="ml-64 p-6">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">Dashboard</h1>
      <div class="flex items-center gap-4">
        <p id="userEmail" class="text-gray-600"></p>
        <button id="logoutBtn" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Logout</button>
      </div>
    </div>

    <!-- Metric Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6" id="metricCards"></div>

    <!-- User Form (User Only) -->
    <section id="userForm" class="hidden max-w-md bg-white p-6 rounded shadow">
      <h2 class="text-lg font-semibold mb-4">Data Sekolah</h2>

      <div class="space-y-3">
        <input id="nama" type="text" placeholder="Nama Sekolah" class="w-full border rounded p-2">
        <input id="npsn" type="text" placeholder="NPSN" class="w-full border rounded p-2">
        <input id="link" type="text" placeholder="Link Spreadsheet" class="w-full border rounded p-2">
        <input id="hp" type="text" placeholder="No. HP" class="w-full border rounded p-2">
      </div>

      <div class="mt-4 flex gap-2">
        <button id="saveBtn" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Simpan</button>
      </div>

      <!-- QR Section -->
      <div class="mt-6 border-t pt-4">
        <!-- Wrapper agar bisa di-hide -->
        <div id="qrWrapper" class="text-center space-y-2">
          <div id="qrCode" class="flex justify-center"></div>
          <a id="downloadQR" href="#" download="qrcode.png"
             class="hidden bg-gray-600 text-white px-3 py-1 rounded hover:bg-gray-700 inline-block">Download QR</a>
        </div>

        <div class="mt-4 flex justify-center">
          <button id="generateQRBtn" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
            Generate QR
          </button>
        </div>
      </div>
    </section>

    
    <!-- Tabel Superadmin -->
    <div id="adminTable" class="hidden bg-white rounded shadow p-4 overflow-auto">
      <h2 class="text-lg font-semibold mb-4">Data Semua User</h2>
      <table class="min-w-full border border-gray-300 table-auto">
        <thead id="tableHead" class="bg-gray-200"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
