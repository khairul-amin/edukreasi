<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Lisensi | Exam Edukreasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="/js/checkout-complete.js" defer></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_right,_rgba(249,115,22,0.16),_transparent_24%),radial-gradient(circle_at_bottom_left,_rgba(34,197,94,0.16),_transparent_30%),linear-gradient(180deg,_#020617,_#0f172a)]"></div>
  <main class="relative mx-auto flex min-h-screen max-w-4xl items-center px-6 py-14">
    <section class="w-full rounded-[2rem] border border-white/10 bg-white/8 p-8 shadow-2xl shadow-slate-950/40 backdrop-blur-xl lg:p-10">
      <div class="grid gap-8 lg:grid-cols-[0.9fr_1.1fr]">
        <div>
          <p class="text-xs uppercase tracking-[0.35em] text-emerald-300">Status Pembayaran</p>
          <h1 class="mt-2 text-3xl font-black text-white lg:text-4xl">Token lisensi siap dipakai di aplikasi client.</h1>
          <p class="mt-3 text-sm text-slate-300">Jika pembayaran baru saja selesai, klik refresh beberapa detik lagi sampai token muncul. Token ini ditandatangani langsung oleh server lisensi online Edukreasi.</p>
          <p id="claimStatus" class="mt-6 text-sm text-sky-100">Memeriksa status pembayaran...</p>
          <div id="claimMeta" class="mt-5 space-y-2"></div>
          <div class="mt-6 flex flex-wrap gap-3">
            <button id="refreshClaimBtn" type="button" class="rounded-2xl border border-white/10 bg-white/5 px-5 py-3 font-semibold text-white hover:bg-white/10">Refresh Status</button>
            <button id="copyClaimBtn" type="button" class="rounded-2xl bg-emerald-400 px-5 py-3 font-semibold text-slate-950 hover:bg-emerald-300" disabled>Salin Token</button>
          </div>
        </div>
        <div>
          <label class="mb-2 block text-sm font-semibold text-slate-200" for="claimToken">Token Lisensi</label>
          <textarea id="claimToken" readonly class="min-h-[320px] w-full rounded-[2rem] border border-white/10 bg-slate-950/80 p-5 font-mono text-sm text-white outline-none"></textarea>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
